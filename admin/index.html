<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSC-30067 Teaching Administration</title><style>:root{--navy:#14213d;--blue:#2563eb;--bg:#f4f7fb;--ink:#182230;--muted:#667085;--border:#d9e0ea;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:var(--navy);color:white;padding:28px max(22px,calc((100% - 760px)/2))}.top small{opacity:.75}.top h1{margin:5px 0 0;font-size:27px}.wrap{max-width:760px;margin:28px auto;padding:0 22px}.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:22px;box-shadow:0 2px 8px #14213d0a}.panel h2{margin:0 0 5px;font-size:20px}.panel p{margin:0 0 18px;color:var(--muted)}label{display:block;font-weight:650;margin-bottom:6px}input{width:100%;padding:11px 12px;border:1px solid #bfc9d8;border-radius:7px;font:inherit}.btn{margin-top:14px;border:0;border-radius:7px;padding:11px 16px;background:var(--blue);color:white;font:inherit;font-weight:650;cursor:pointer}.result{display:none;margin-top:18px;padding:15px;border-radius:8px;background:#eff6ff;border:1px solid #bfdbfe}.error{background:#fee4e2;border-color:#fecaca;color:var(--red)}.result dl{display:grid;grid-template-columns:150px 1fr;gap:7px;margin:0}.result dt{font-weight:650}.result dd{margin:0;word-break:break-word}.hint{font-size:13px;color:var(--muted);margin-top:14px}</style></head><body><header class="top"><small>CSC-30067 · 2026/27</small><h1>Teaching Administration</h1></header><main class="wrap"><section class="panel"><h2>Find GitHub user</h2><p>Enter a GitHub username to retrieve the corresponding GitHub account ID.</p><form id="lookupForm"><label for="githubUsername">GitHub username</label><input id="githubUsername" autocomplete="off" placeholder="e.g. octocat" required><button class="btn" type="submit">Find GitHub ID</button></form><div id="result" class="result"></div><div class="hint">Admin lookup endpoint. The Worker must validate the short-lived session cookie before returning data.</div></section></main><script>const WORKER_URL='https://YOUR-WORKER.workers.dev';const form=document.getElementById('lookupForm'),result=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();const username=document.getElementById('githubUsername').value.trim();result.className='result';result.style.display='block';result.textContent='Looking up GitHub user…';try{const response=await fetch(`${WORKER_URL}/admin/github-user?username=${encodeURIComponent(username)}`,{credentials:'include'});const data=await response.json();if(!response.ok){result.className='result error';result.textContent=data.error||'Lookup failed.';return}result.innerHTML=`<dl><dt>GitHub username</dt><dd>${escapeHtml(String(data.login))}</dd><dt>GitHub ID</dt><dd>${escapeHtml(String(data.id))}</dd></dl>`}catch{result.className='result error';result.textContent='Could not contact the Worker.'}});function escapeHtml(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
